name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax check ES modules
        run: npm run check

      - name: Verify Wiki internal links
        run: |
          node -e '
            import("./src/wikiData.js").then(({ GLOSSARY, WIKI_SECTIONS, WIKI_PAGES }) => {
              const bad = [];
              for (const s of WIKI_SECTIONS) for (const pid of s.pages) if (!WIKI_PAGES[pid]) bad.push("missing page: " + pid);
              for (const p of Object.values(WIKI_PAGES)) {
                for (const m of p.body.matchAll(/\[\[([a-z0-9_-]+)\|[^\]]+\]\]/gi)) {
                  if (!GLOSSARY[m[1]] && !WIKI_PAGES[m[1]]) bad.push(`broken link [[${m[1]}]] in ${p.id}`);
                }
              }
              console.log("Wiki integrity:", { pages: Object.keys(WIKI_PAGES).length, glossary: Object.keys(GLOSSARY).length, errors: bad });
              if (bad.length) process.exit(1);
            });
          '

      - name: Run Genesis & Take-01 verification suites
        run: npm test
